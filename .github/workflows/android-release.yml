name: Android Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-release-apk:
    name: Build Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install NDK 24
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "ndk;24.0.8215888"

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "VERSION_NAME=$VERSION" >> $GITHUB_ENV
          PATCH=${VERSION##*.}
          MAJOR=${VERSION%%.*}
          MINOR=$(echo ${VERSION} | cut -d. -f2)
          VERSION_CODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV

      - name: Apply version to build
        run: |
          sed -i "s/versionCode .*/versionCode ${VERSION_CODE}/" app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"${VERSION_NAME}\"/" app/build.gradle

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: neonnode-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
